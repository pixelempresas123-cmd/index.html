<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Battle Zone — Arena</title>
<style>
:root{--navy:#121b3c;--navy2:#263764;--gold:#ffd83d;--yellow:#ffcb24;--cyan:#43d9ff;--pink:#ff4e96;--white:#fff}
*{box-sizing:border-box}body{margin:0;background:#101832;color:white;font-family:Arial,Helvetica,sans-serif;overflow:hidden}button{border:0;cursor:pointer;font:900 14px Arial;letter-spacing:.3px;color:#fff;padding:10px 13px;border-radius:10px;background:linear-gradient(#49d2ff,#1684d2);box-shadow:0 4px #07528e;text-shadow:1px 2px #17406b;transition:.12s}button:hover{filter:brightness(1.13);transform:translateY(-1px)}button:active{transform:translateY(2px);box-shadow:none}button.gold{background:linear-gradient(#fff06a,#ffbd19);color:#402a00;text-shadow:1px 1px #fff5b5;box-shadow:0 5px #a95b12}button.pink{background:linear-gradient(#ff83b5,#e72e75);box-shadow:0 4px #8b1749}button.dark{background:linear-gradient(#52617e,#293654);box-shadow:0 4px #111b30}button.green{background:linear-gradient(#73ed8b,#20a85c);box-shadow:0 4px #12633c}
#app{position:relative;height:100dvh;min-height:560px;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#ff70b4 0,#c72c83 35%,#57265f 68%,#151c3c 100%)}
#bg{position:absolute;inset:0;overflow:hidden;background:linear-gradient(180deg,#e83d8d 0%,#ff66a7 45%,#8c2e8d 70%,#321a53 100%)}
#bg:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 49%,#fff7 0,transparent 27%),repeating-linear-gradient(90deg,transparent 0 95px,#571b6840 96px 105px)}
.arch{position:absolute;width:55vw;height:46vw;max-height:470px;max-width:800px;min-width:320px;left:50%;top:20%;transform:translateX(-50%);border:24px solid #6c537a;border-bottom:0;border-radius:50% 50% 0 0;box-shadow:inset 0 0 0 9px #fa8b7a,0 0 0 4px #2e224e;opacity:.9}
.floor{position:absolute;bottom:-1px;left:0;right:0;height:35%;background:repeating-conic-gradient(from 0deg at 50% 0%,#b332a2 0 12.5%,#54245f 0 25%) 50% 0/100px 100px;clip-path:polygon(0 0,100% 0,100% 100%,0 100%)}
.floor:before{content:"";position:absolute;top:0;left:0;right:0;height:8px;background:#ff64c8}
.topbar{position:absolute;z-index:5;top:0;left:0;right:0;min-height:66px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px;padding:9px 12px;background:linear-gradient(#10172be8,#10172b00)}
.profile{display:flex;align-items:center;gap:7px}.profilepic{width:52px;height:48px;display:grid;place-items:center;font-size:28px;background:#303c60;border:3px solid #8797b5;border-radius:9px;box-shadow:0 4px #101326}.profileinfo{background:#f8cb2f;color:#432d05;border:3px solid #6f3a5a;border-radius:8px;padding:5px 9px;font-weight:900;box-shadow:0 4px #2b1b3e}.brand{font-weight:1000;font-style:italic;font-size:clamp(20px,3.5vw,34px);color:#ffdf40;text-shadow:3px 3px #6c214f,-1px -1px white;white-space:nowrap}.wallet{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}.wallet span{background:#151b32e8;border:2px solid #5b6480;border-radius:9px;padding:7px 8px;font-weight:900;white-space:nowrap}.menuBtn{font-size:22px;padding:7px 13px}
#screen{position:absolute;z-index:2;inset:74px 0 0;overflow:auto;padding:12px}
.homegrid{height:100%;min-height:420px;display:grid;grid-template-columns:minmax(95px,150px) 1fr minmax(95px,150px);gap:10px;align-items:stretch;max-width:1500px;margin:auto}
.side{display:flex;flex-direction:column;gap:10px;justify-content:center}.side button{min-height:62px;background:linear-gradient(#53627f,#252d49);box-shadow:0 5px #12182d;border:2px solid #8996b5;font-size:12px;padding:7px 4px}.side .ico{font-size:24px;display:block;margin-bottom:3px}.centerstage{position:relative;display:flex;align-items:center;justify-content:center;min-width:0}.characterStage{text-align:center;position:relative;z-index:1;margin-top:-28px}.heroEmote{font-size:clamp(100px,17vw,205px);line-height:1;filter:drop-shadow(0 10px 0 #522247);animation:bob 2.4s ease-in-out infinite}.heroName{font-size:clamp(17px,2vw,25px);font-weight:1000;text-shadow:2px 3px #452045}.heroStats{display:inline-block;background:#162344d9;border:2px solid #8bb9ed;border-radius:8px;padding:6px 12px;font-weight:900}.stagebadge{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:#132447d9;border:2px solid #8ab7eb;border-radius:9px;padding:8px 12px;font-weight:900;white-space:nowrap}
.eventbar{position:absolute;bottom:7px;left:0;right:0;display:grid;grid-template-columns:1.1fr .9fr;gap:9px;align-items:stretch}.eventcard{background:#202b48;border:3px solid #7889a8;border-radius:10px;padding:9px;display:flex;align-items:center;gap:9px;min-width:0}.eventicon{font-size:32px}.eventcard small{display:block;color:#ffd642;font-weight:900}.playbutton{font-size:clamp(24px,4vw,42px);min-height:86px;border-radius:13px}
.page{max-width:1100px;margin:0 auto;background:#18274deF;border:3px solid #779bd0;border-radius:18px;padding:18px;box-shadow:0 8px #0c1430;max-height:100%;overflow:auto}.pagehead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.page h2{margin:0;font-size:clamp(22px,4vw,32px);text-shadow:2px 3px #10182f}.sub{color:#c5d9ff;margin-top:5px;font-size:13px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}.card{background:#0d1936;border:2px solid #425b8c;border-radius:14px;text-align:center;padding:12px;min-width:0}.card.active{border-color:#ffe34c;box-shadow:0 0 0 3px #ffe34c33}.bigemoji{font-size:62px;height:78px;display:grid;place-items:center;filter:drop-shadow(2px 4px #0006)}.card h3{margin:5px 0 7px}.card p{font-size:12px;line-height:1.4;color:#c5d9ff;min-height:31px;margin:5px 0 10px}.label{font-size:10px;color:#ffe34c;font-weight:900;letter-spacing:1px}.mappreview{height:85px;border-radius:9px;margin-bottom:8px;position:relative;overflow:hidden;border:2px solid #7384a8}.mappreview:before{content:"";position:absolute;inset:0;background-size:30px 30px}.mappreview.jungle{background:#347d58}.mappreview.jungle:before{background-image:radial-gradient(#164e3c 8px,transparent 9px),linear-gradient(45deg,transparent 46%,#c6aa6d 47% 54%,transparent 55%)}.mappreview.desert{background:#d6a65b}.mappreview.desert:before{background-image:radial-gradient(#8e663b 8px,transparent 9px),linear-gradient(90deg,transparent 45%,#e9cf8d 46% 53%,transparent 54%)}.mappreview.ice{background:#72c8e3}.mappreview.ice:before{background-image:linear-gradient(45deg,transparent 45%,#f0ffff 46% 56%,transparent 57%),radial-gradient(#4d9cbf 8px,transparent 9px)}.mappreview.lava{background:#7f344b}.mappreview.lava:before{background-image:radial-gradient(#ff8c37 8px,transparent 9px),linear-gradient(45deg,transparent 45%,#401d36 46% 55%,transparent 56%)}.mappreview.city{background:#697b91}.mappreview.city:before{background-image:linear-gradient(90deg,transparent 20%,#34465c 21% 35%,transparent 36% 60%,#34465c 61% 75%,transparent 76%),linear-gradient(#34465c 20%,transparent 21% 70%,#34465c 71%)}.mappreview.void{background:#48316e}.mappreview.void:before{background-image:radial-gradient(#d16bff 5px,transparent 6px),linear-gradient(45deg,transparent 45%,#211b4b 46% 55%,transparent 56%)}
#battle{display:none;position:absolute;inset:0;z-index:8;background:#1c493e}#gamecanvas{display:block;width:100%;height:100%;touch-action:none}.hud{position:absolute;left:10px;right:10px;top:9px;display:flex;justify-content:space-between;gap:6px;pointer-events:none}.hud div{background:#101b39e8;border:2px solid #91b9e9;border-radius:9px;padding:7px 10px;font-weight:900;text-shadow:1px 2px #111;max-width:45%}.battlecontrols{position:absolute;left:12px;right:12px;bottom:14px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}.battlecontrols button{pointer-events:auto}.attackbtn{border-radius:50%;width:78px;height:78px;background:linear-gradient(#fff06a,#ff9d20);color:#482800;box-shadow:0 5px #8b4b16}.movehint{position:absolute;bottom:103px;left:50%;transform:translateX(-50%);background:#101b39d9;padding:7px 10px;border-radius:7px;font-size:12px;white-space:nowrap}.modalback{display:none;position:absolute;z-index:20;inset:0;background:#040919c9;align-items:center;justify-content:center;padding:16px}.modal{width:min(430px,100%);background:#1c3263;border:3px solid #8fcaff;border-radius:20px;padding:23px;text-align:center;box-shadow:0 8px #0a1128}.modal h2{margin:5px 0 10px}.toast{position:absolute;z-index:30;top:82px;left:50%;transform:translateX(-50%);background:#ffe56a;color:#432a00;border:2px solid white;border-radius:9px;padding:10px 14px;font-weight:900;display:none}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-10px) rotate(2deg)}}
@media(max-width:700px){.topbar{padding:7px}.profileinfo{display:none}.profilepic{width:40px;height:40px}.wallet span{font-size:11px;padding:6px}.brand{font-size:20px}.menuBtn{font-size:18px;padding:6px 9px}#screen{inset:60px 0 0;padding:7px}.homegrid{grid-template-columns:75px 1fr 75px;gap:5px}.side{gap:7px}.side button{font-size:9px;min-height:55px}.side .ico{font-size:20px}.heroEmote{font-size:clamp(90px,22vw,150px)}.stagebadge{font-size:10px;top:4px}.eventbar{grid-template-columns:1fr;bottom:0}.eventcard{padding:6px}.eventicon{font-size:24px}.playbutton{min-height:54px;font-size:26px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.page{padding:12px}.card{padding:8px}.bigemoji{font-size:48px;height:58px}.movehint{font-size:10px;bottom:96px}}
</style></head>
<body><div id="app"><div id="bg"><div class="arch"></div><div class="floor"></div></div>
<header class="topbar"><div class="profile"><div class="profilepic" id="profileEmoji">🛡️</div><div class="profileinfo"><div id="playerName">JOGADOR</div><div>🏆 <span id="topTrophies">0</span></div></div></div><div class="brand">BATTLE ZONE</div><div class="wallet"><span>💎 <b id="gems">12</b></span><span>🪙 <b id="coins">250</b></span><span>🏆 <b id="trophies">0</b></span></div><button class="dark menuBtn" onclick="showSettings()">☰</button></header>
<main id="screen"></main><div id="toast" class="toast"></div>
<div id="battle"><canvas id="gamecanvas"></canvas><div class="hud"><div id="health">❤️ 100</div><div id="battleInfo">ARENA</div><div id="elims">ELIMS 0</div></div><div class="movehint">WASD / setas para mover · Espaço ou toque para atacar</div><div class="battlecontrols"><button class="dark" onclick="pauseBattle()">Ⅱ PAUSAR</button><button class="attackbtn" id="attack">⚡<br>ATACAR</button></div></div>
<div id="modalback" class="modalback"><div class="modal" id="modal"></div></div></div>
<script>
const heroes=[
{id:'kevin',name:'Kevin',emoji:'🦊',role:'Atacante',rarity:'INICIAL',cost:0,hp:105,dmg:21,speed:2.8,color:'#ff7f50',desc:'Ataques rápidos e precisos'},
{id:'bruwly',name:'Bruwly',emoji:'🐻',role:'Tanque',rarity:'SUPER RARO',cost:190,hp:155,dmg:23,speed:2.1,color:'#a0522d',desc:'Muita resistência e força'},
{id:'warmin',name:'Warmin',emoji:'🔥',role:'Atirador',rarity:'ÉPICO',cost:270,hp:98,dmg:27,speed:2.6,color:'#ff4500',desc:'Poder de fogo intenso'}
];
const maps=[
{id:'jungle',name:'Floresta Viva',type:'Sobrevivência',desc:'Árvores e caminhos estreitos',color:'#327f5a'},
{id:'desert',name:'Deserto Dourado',type:'Caça às estrelas',desc:'Dunas e ruínas antigas',color:'#d5a55b'},
{id:'ice',name:'Vale Congelado',type:'Sobrevivência',desc:'Gelo e pedras escorregadias',color:'#70cce4'},
{id:'lava',name:'Cratera de Lava',type:'Caça às estrelas',desc:'Terreno quente e perigoso',color:'#80334b'},
{id:'city',name:'Cidade Neon',type:'Duelo',desc:'Ruas e construções',color:'#65798f'},
{id:'void',name:'Templo Cósmico',type:'Treinamento',desc:'Ruínas misteriosas',color:'#48316e'}
];
let saveData=loadSave(),screenName='home',chosenMode='Sobrevivência',chosenMap='jungle',battle=null,keys={},last=0,raf=0,canvas=document.getElementById('gamecanvas'),ctx=canvas.getContext('2d'),W=800,H=600,dpr=1,touch=null,shopTab='Ofertas',detailHero='kevin';
function loadSave(){try{return JSON.parse(localStorage.getItem('battle-zone-v4'))||{coins:250,gems:12,trophies:0,wins:0,owned:['kevin'],selected:'kevin',items:[],miraLevel:1,miraBest:0,daily:false}}catch(e){return {coins:250,gems:12,trophies:0,wins:0,owned:['kevin'],selected:'kevin',items:[],miraLevel:1,miraBest:0,daily:false}}}
function save(){localStorage.setItem('battle-zone-v4',JSON.stringify(saveData));wallet()}
function wallet(){['coins','gems','trophies'].forEach(k=>document.getElementById(k).textContent=saveData[k]);document.getElementById('topTrophies').textContent=saveData.trophies;document.getElementById('profileEmoji').textContent=hero().emoji}
function hero(){return heroes.find(h=>h.id===saveData.selected)||heroes[0]}
function toast(t){let e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>e.style.display='none',2200)}
function home(){stopBattle();screenName='home';document.getElementById('screen').innerHTML=`<div class="homegrid"><aside class="side"><button onclick="shop()"><span class="ico">🛒</span>LOJA</button><button onclick="characters()"><span class="ico">🎭</span>PERSONAGENS</button><button onclick="mapsPage()"><span class="ico">🗺️</span>MAPAS</button><button onclick="quests()"><span class="ico">📋</span>MISSÕES</button></aside><section class="centerstage"><div class="stagebadge">⭐ RANK ${Math.floor(saveData.trophies/50)+1} · hero().role.toUpperCase()</div><divclass="characterStage"><divclass="heroEmote">{hero().emoji}</div><div class="heroName">${hero().name}</div><div class="heroStats">❤️ ${hero().hp}　⚡ ${hero().dmg}　🏆 saveData.trophies</div></div><divclass="eventbar"><divclass="eventcard"style="cursor:pointer"onclick="mapsPage()"><divclass="eventicon">🎯</div><div><b>{chosenMode.toUpperCase()}</b><small>${maps.find(m=>m.id===chosenMap).name}</small><span style="font-size:11px;color:#c7d7f4">Mapa selecionado</span></div></div><button class="gold playbutton" onclick="modesPage()">JOGAR ▶</button></div></section><aside class="side"><button onclick="profile()"><span class="ico">🏆</span>PERFIL</button><button onclick="friends()"><span class="ico">👥</span>AMIGOS</button><button onclick="mapsPage()"><span class="ico">🗺️</span>MAPAS</button><button onclick="showSettings()"><span class="ico">⚙️</span>OPÇÕES</button></aside></div>`;document.getElementById('screen').style.display='block';document.getElementById('bg').style.display='block';document.getElementById('screen').style.inset='74px 0 0';wallet()}
function page(title,sub,body){stopBattle();screenName='page';document.getElementById('bg').style.display='block';document.getElementById('screen').style.display='block';document.getElementById('screen').style.inset='74px 0 0';document.getElementById('screen').innerHTML=`<section class="page"><div class="pagehead"><div><h2>title</h2><divclass="sub">{sub}</div></div><button class="dark" onclick="home()">← INÍCIO</button></div>${body}</section>`}
function characters(){page('HERÓIS','Colecione personagens originais, veja seus atributos e escolha quem vai para a arena.',`<div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:13px"><span class="heroStats">HERÓIS saveData.owned.length/{heroes.length}</span><button class="dark" onclick="characters()">TODOS</button><button class="dark" onclick="charactersOwned()">DESBLOQUEADOS</button><button class="dark" onclick="charactersLocked()">BLOQUEADOS</button></div><div class="cards">${heroes.map(h=>{let own=saveData.owned.includes(h.id),sel=saveData.selected===h.id;return `<article class="card sel?'active':''"style="cursor:pointer"onclick="heroDetail('{h.id}')"><div style="display:flex;justify-content:space-between"><span class="label">h.rarity</span><span>{own?'🟢':'🔒'}</span></div><div class="bigemoji" style="background:linear-gradient(145deg,h.color55,#111b3b);border-radius:12px;margin:7px0">{h.emoji}</div><h3>h.name</h3><p>{h.role}<br>❤️ ${h.hp} · ⚡ h.dmg</p><buttonclass="{sel?'gold':''}" onclick="event.stopPropagation();${own?`equip('${h.id}')`:`buyHero('${h.id}')`}">${own?(sel?'✓ EQUIPADO':'VER / EQUIPAR'):'🪙 '+h.cost}</button></article>`}).join('')}</div>`)}
function charactersOwned(){page('MEUS HERÓIS','Personagens já desbloqueados.',`<div class="cards">${heroes.filter(h=>saveData.owned.includes(h.id)).map(h=>`<article class="card"><div class="bigemoji">${h.emoji}</div><h3>h.name</h3><p>{h.role}</p><button class="gold" onclick="heroDetail('${h.id}')">VER PERSONAGEM</button></article>`).join('')}</div>`)}
function charactersLocked(){page('DESBLOQUEAR HERÓIS','Use moedas virtuais para ampliar sua coleção.',`<div class="cards">${heroes.filter(h=>!saveData.owned.includes(h.id)).map(h=>`<article class="card"><div class="bigemoji">${h.emoji}</div><h3>h.name</h3><p>{h.rarity}<br>h.desc</p><buttonclass="gold"onclick="buyHero('{h.id}')">🪙 ${h.cost} · DESBLOQUEAR</button></article>`).join('')||'<p>Você já desbloqueou todos os heróis!</p>'}</div>`)}
function heroDetail(id){detailHero=id;let h=heroes.find(x=>x.id===id),own=saveData.owned.includes(id),sel=saveData.selected===id;page(h.name.toUpperCase(),'Detalhes do herói · personagem original de Battle Zone',`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px;align-items:center"><div class="card" style="background:radial-gradient(circle,h.color66,#0d193670%)"><divstyle="font-size:clamp(100px,18vw,180px);line-height:1.2">{h.emoji}</div><div class="label">h.rarity</div><h2>{h.name}</h2><p>h.desc</p><divstyle="display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><buttonclass="{sel?'gold':''}" onclick="${own?`equip('${id}');heroDetail('id')`:`buyHero('{id}');heroDetail('${id}')`}">${own?(sel?'✓ SELECIONADO':'SELECIONAR'):'🪙 '+h.cost+' · DESBLOQUEAR'}</button><button class="dark" onclick="startBattle()">TESTAR</button></div></div><div class="card" style="text-align:left"><h3>ATRIBUTOS</h3><p>❤️ Vida</p><div style="height:12px;background:#34415e;border-radius:9px;overflow:hidden"><div style="height:100%;width:Math.min(100,h.hp/1.7)%;background:#5ce18c"></div></div><p>⚡Ataque</p><divstyle="height:12px;background:#34415e;border-radius:9px;overflow:hidden"><divstyle="height:100%;width:{Math.min(100,h.dmg*3)}%;background:#ff657e"></div></div><p>💨 Velocidade</p><div style="height:12px;background:#34415e;border-radius:9px;overflow:hidden"><div style="height:100%;width:h.speed/4*100%;background:#56d8ff"></div></div><pstyle="margin-top:15px">Classe:<b>{h.role}</b></p><p>Raridade: <b>h.rarity</b></p><p>Estado:<b>{own?'Desbloqueado':'Bloqueado'}</b></p><button class="dark" onclick="characters()">← VOLTAR À COLEÇÃO</button></div></div>`)}
function equip(id){saveData.selected=id;save();characters();toast('Personagem equipado!')}
function buyHero(id){let h=heroes.find(x=>x.id===id);if(saveData.coins<h.cost)return toast('Moedas insuficientes!');saveData.coins-=h.cost;saveData.owned.push(id);saveData.selected=id;save();characters();toast(h.name+' desbloqueado!')}
function mapsPage(){page('MAPAS E ARENAS','Escolha o cenário da próxima partida. A seleção muda o campo de batalha.',`<div class="cards">${maps.map(m=>`<article class="card ${chosenMap===m.id?'active':''}"><div class="mappreview m.id"></div><divclass="label">{m.type.toUpperCase()}</div><h3>m.name</h3><p>{m.desc}</p><button class="chosenMap===m.id?'gold':''"onclick="chooseMap('{m.id}')">${chosenMap===m.id?'✓ SELECIONADO':'ESCOLHER MAPA'}</button></article>`).join('')}</div><p class="sub" style="margin-top:14px">Mapa atual: <b>${maps.find(m=>m.id===chosenMap).name}</b></p><button class="gold" onclick="home()">CONFIRMAR E VOLTAR</button>`)}
function chooseMap(id){chosenMap=id;mapsPage();toast('Mapa selecionado: '+maps.find(m=>m.id===id).name)}
function shop(tab){if(tab)shopTab=tab;let items={
'Ofertas':[{id:'skin1',emoji:'✨',name:'Efeito brilhante',cost:80,desc:'Efeito visual especial'},{id:'boost1',emoji:'🪙',name:'Bolsa de moedas',cost:0,desc:'Recompensa grátis: 30 moedas',free:true},{id:'badge1',emoji:'🏅',name:'Emblema dourado',cost:65,desc:'Decoração de perfil'}],
'Recursos':[{id:'coins50',emoji:'🪙',name:'Pacote de moedas',cost:0,desc:'Receba 50 moedas de demonstração',free:true},{id:'gems5',emoji:'💎',name:'Gemas de treino',cost:100,desc:'Troque moedas por 5 gemas'},{id:'badge2',emoji:'🎖️',name:'Medalha da arena',cost:90,desc:'Um item de coleção'}],
'Cosméticos':[{id:'skin3',emoji:'🔥',name:'Aura flamejante',cost:140,desc:'Cosmético demonstrativo'},{id:'skin4',emoji:'🌟',name:'Brilho estelar',cost:100,desc:'Cosmético demonstrativo'},{id:'badge3',emoji:'👑',name:'Ícone de coroa',cost:180,desc:'Ícone para o perfil'}]
};page('LOJA','Ofertas, recursos e cosméticos usando apenas moedas virtuais.',`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">${['Ofertas','Recursos','Cosméticos'].map(t=>`<button class="${shopTab===t?'gold':'dark'}" onclick="shop('t')">{t.toUpperCase()}</button>`).join('')}</div><div class="cards">${items[shopTab].map(i=>{let got=saveData.items.includes(i.id);return `<article class="card"><div class="bigemoji">${i.emoji}</div><div class="label">shopTab.toUpperCase()</div><h3>{i.name}</h3><p>i.desc</p><buttonclass="{i.free?'green':'gold'}" got?'disabled':''onclick="buyItem('{i.id}',i.cost,{!!i.free})">${got?'✓ ADQUIRIDO':i.free?'PEGAR GRÁTIS':'🪙 '+i.cost}</button></article>`}).join('')}</div><p class="sub" style="margin-top:12px">Moedas: ${saveData.coins} · Gemas: ${saveData.gems} · Compras apenas dentro do jogo de demonstração.</p>`)}
function buyItem(id,cost,free){if(saveData.items.includes(id))return;if(!free&&saveData.coins<cost)return toast('Moedas insuficientes!');if(!free)saveData.coins-=cost;else saveData.coins+=30;saveData.items.push(id);save();shop();toast('Item adicionado à coleção!')}
function quests(){
  let needed = 3 + (saveData.miraLevel-1)*2;
  let miraDone = saveData.miraBest >= needed;
  let miraTitle = 'Treino de mira' + (saveData.miraLevel>1 ? ' ' + ['','I','II','III','IV','V','VI','VII','VIII','IX','X'][saveData.miraLevel] || saveData.miraLevel : '');
  page('MISSÕES','Complete desafios para ganhar recompensas.',`
  <div class="cards">
    <article class="card"><div class="bigemoji">🎯</div><h3>Primeira batalha</h3><p>Entre em uma partida.</p><button onclick="startBattle()">JOGAR</button></article>
    <article class="card ${miraDone?'active':''}">
      <div class="bigemoji">⚡</div>
      <h3>${miraTitle}</h3>
      <p>Consiga ${needed} eliminações em uma partida.<br>Melhor: saveData.miraBest/{needed}</p>
      ${miraDone ? '<button class="gold" onclick="claimMira()">RESGATAR +15 MOEDAS</button>' : '<button onclick="startBattle(\'Treinamento\')">TREINAR</button>'}
    </article>
    ${!saveData.daily ? '<article class="card"><div class="bigemoji">🪙</div><h3>Recompensa diária</h3><p>Receba moedas grátis uma vez por sessão.</p><button class="gold" onclick="daily()">RECEBER 20</button></article>' : ''}
  </div>`)}
function claimMira(){
  let needed = 3 + (saveData.miraLevel-1)*2;
  if(saveData.miraBest < needed) return;
  saveData.coins += 15;
  saveData.miraLevel++;
  saveData.miraBest = 0;
  save();
  quests();
  toast('Missão concluída! Próximo nível liberado.');
}
function daily(){if(saveData.daily)return toast('Você já pegou a recompensa desta sessão.');saveData.daily=true;saveData.coins+=20;save();quests();toast('+20 moedas!')}
function modesPage(){page('MODOS DE JOGO','Escolha como quer entrar na arena.',`<div class="cards">${[{name:'Sobrevivência',emoji:'💎',desc:'Derrote os bots e seja o último na arena.'},{name:'Caça às estrelas',emoji:'⭐',desc:'Treine sua mira e consiga eliminações.'},{name:'Duelo',emoji:'⚔️',desc:'Enfrente adversários em combate direto.'},{name:'Treinamento',emoji:'🎯',desc:'Pratique ataques contra bots.'}].map(m=>`<article class="card chosenMode===m.name?'active':''"><divclass="bigemoji">{m.emoji}</div><h3>m.name</h3><p>{m.desc}</p><button class="chosenMode===m.name?'gold':'dark'"onclick="chosenMode='{m.name}';modesPage()"> chosenMode===m.name?'✓SELECIONADO':'ESCOLHER'</button><buttonstyle="margin-top:8px"onclick="chosenMode='{m.name}';startBattle()">JOGAR</button></article>`).join('')}</div><p style="margin-top:14px"><button class="dark" onclick="mapsPage()">ESCOLHER MAPA →</button></p>`)}
function profile(){page('PERFIL DO JOGADOR','Suas estatísticas e progresso.',`<div class="cards"><article class="card"><div class="bigemoji">hero().emoji</div><h3>{hero().name}</h3><p>Personagem equipado</p></article><article class="card"><div class="bigemoji">🏆</div><h3>saveData.trophies</h3><p>Troféus</p></article><articleclass="card"><divclass="bigemoji">🥇</div><h3>{saveData.wins}</h3><p>Vitórias</p></article><article class="card"><div class="bigemoji">🪙</div><h3>${saveData.coins}</h3><p>Moedas</p></article></div><p style="margin-top:16px"><button class="dark" onclick="if(confirm('Apagar todo o progresso?')){localStorage.removeItem('battle-zone-v4');saveData=loadSave();home()}">REINICIAR PROGRESSO</button></p>`)}
function friends(){page('AMIGOS','Modo local demonstrativo.',`<div class="card" style="max-width:520px;margin:auto"><div class="bigemoji">👥</div><h3>Jogue com bots por enquanto</h3><p>Lista de amigos e partidas online precisam de um servidor multiplayer e não estão disponíveis nesta versão local.</p><button onclick="startBattle()">JOGAR CONTRA BOTS</button></div>`)}
function showSettings(){openModal(`<div class="bigemoji">⚙️</div><h2>OPÇÕES</h2><p>Battle Zone salva seu progresso neste navegador.</p><button onclick="closeModal();profile()">VER PERFIL</button> <button class="dark" onclick="closeModal();home()">VOLTAR</button>`)}
function openModal(s){document.getElementById('modal').innerHTML=s;document.getElementById('modalback').style.display='flex'}function closeModal(){document.getElementById('modalback').style.display='none'}
function resize(){let r=canvas.getBoundingClientRect();dpr=window.devicePixelRatio||1;canvas.width=Math.round(r.width*dpr);canvas.height=Math.round(r.height*dpr);W=r.width;H=r.height}
function startBattle(mode){if(mode)chosenMode=mode;stopBattle();document.getElementById('screen').style.display='none';document.getElementById('bg').style.display='none';document.getElementById('battle').style.display='block';resize();let h=hero();battle={player:{x:0,y:0,r:17,hp:h.hp,maxhp:h.hp,dmg:h.dmg,speed:h.speed,emoji:h.emoji,color:h.color,cd:0,inv:0},bots:[],shots:[],elims:0,time:0};for(let i=0;i<5;i++){let a=Math.PI*2*i/5; battle.bots.push({x:Math.cos(a)*Math.min(W,H)*.28,y:Math.sin(a)*Math.min(W,H)*.28,r:16,hp:65,maxhp:65,dmg:20,speed:1+Math.random()*.5,emoji:['👾','🐙','👽','🦇','💀'][i],color:['#ff557a','#c77bff','#ffb53b','#5bd6cb','#f4e45d'][i],cd:40+Math.random()*60,alive:true})}document.getElementById('battleInfo').textContent=maps.find(m=>m.id===chosenMap).name.toUpperCase();last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
function stopBattle(){if(battle){battle=null;cancelAnimationFrame(raf)}document.getElementById('battle').style.display='none';if(screenName!=='home')document.getElementById('screen').style.display='block'}
function pauseBattle(){if(!battle)return;cancelAnimationFrame(raf);openModal(`<div class="bigemoji">Ⅱ</div><h2>PARTIDA PAUSADA</h2><p>Continue ou saia para o menu.</p><button class="gold" onclick="closeModal();last=performance.now();raf=requestAnimationFrame(loop)">CONTINUAR</button> <button class="dark" onclick="closeModal();battle=null;home()">SAIR</button>`)}
function loop(now){if(!battle)return;let dt=Math.min(2,(now-last)/16.67);last=now;update(dt);draw();raf=requestAnimationFrame(loop)}
function update(dt){let b=battle,p=b.player;b.time+=dt;let dx=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0),dy=(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0),len=Math.hypot(dx,dy)||1;p.x+=dx/len*p.speed*dt;p.y+=dy/len*p.speed*dt;p.x=Math.max(-W/2+25,Math.min(W/2-25,p.x));p.y=Math.max(-H/2+25,Math.min(H/2-25,p.y));p.cd=Math.max(0,p.cd-dt);p.inv=Math.max(0,p.inv-dt);
for(let e of b.bots){if(!e.alive)continue;let vx=p.x-e.x,vy=p.y-e.y,d=Math.hypot(vx,vy)||1;if(d>90){e.x+=vx/d*e.speed*dt;e.y+=vy/d*e.speed*dt}else if(d<55){e.x-=vx/d*e.speed*.7*dt;e.y-=vy/d*e.speed*.7*dt}e.x=Math.max(-W/2+22,Math.min(W/2-22,e.x));e.y=Math.max(-H/2+22,Math.min(H/2-22,e.y));e.cd-=dt;if(d<260&&e.cd<=0){b.shots.push({x:e.x,y:e.y,vx:vx/d*3,vy:vy/d*3,owner:'bot',dmg:e.dmg,r:5,life:0});e.cd=70+Math.random()*45}}
for(let s of b.shots){s.x+=s.vx*dt;s.y+=s.vy*dt;s.life+=dt;if(s.owner==='player'){for(let e of b.bots){if(e.alive&&Math.hypot(s.x-e.x,s.y-e.y)<e.r+s.r){e.hp-=s.dmg;s.life=999;if(e.hp<=0){e.alive=false;b.elims++;saveData.coins+=8;save();if(b.elims>=5){finish(true);return}}}}}else if(Math.hypot(s.x-p.x,s.y-p.y)<p.r+s.r&&p.inv<=0){p.hp-=s.dmg;p.inv=13;if(p.hp<=0){finish(false);return}}}
b.shots=b.shots.filter(s=>s.life<90&&Math.abs(s.x)<W&&Math.abs(s.y)<H);document.getElementById('health').textContent='❤️ '+Math.max(0,Math.ceil(p.hp))+'/'+p.maxhp;document.getElementById('elims').textContent='ELIMS '+b.elims;if(b.time>1800)finish(p.hp>0)}
function attack(){if(!battle||battle.player.cd>0)return;let b=battle,p=b.player,target=b.bots.filter(e=>e.alive).sort((a,c)=>Math.hypot(a.x-p.x,a.y-p.y)-Math.hypot(c.x-p.x,c.y-p.y))[0],ang=target?Math.atan2(target.y-p.y,target.x-p.x):0;p.cd=14;b.shots.push({x:p.x+Math.cos(ang)*22,y:p.y+Math.sin(ang)*22,vx:Math.cos(ang)*6.4,vy:Math.sin(ang)*6.4,owner:'player',dmg:p.dmg,r:7,life:0})}
function draw(){let b=battle;if(!b)return;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);let m=chosenMap;ctx.fillStyle=maps.find(x=>x.id===m).color;ctx.fillRect(0,0,W,H);ctx.save();ctx.translate(W/2-b.player.x,H/2-b.player.y);ctx.strokeStyle='#ffffff19';ctx.lineWidth=1;for(let x=-W;x<W;x+=38){ctx.beginPath();ctx.moveTo(x,-H);ctx.lineTo(x,H);ctx.stroke()}for(let y=-H;y<H;y+=38){ctx.beginPath();ctx.moveTo(-W,y);ctx.lineTo(W,y);ctx.stroke()}
for(let i=0;i<18;i++){let x=((i*139)%(W+160))-W/2,y=((i*91)%(H+160))-H/2;ctx.fillStyle=m==='ice'?'#d3f5ff55':m==='desert'?'#8c653d88':m==='lava'?'#3a1b3f':m==='city'?'#36475e':m==='void'?'#241745':'#174b3a';ctx.fillRect(x,y,35,32);ctx.fillStyle='#ffffff22';ctx.fillRect(x+4,y+4,26,5)}
for(let s of b.shots){ctx.fillStyle=s.owner==='player'?'#fff176':'#ff557a';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill()}for(let e of b.bots){if(!e.alive)continue;fighter(e);ctx.fillStyle='#16213b';ctx.fillRect(e.x-19,e.y-27,38,5);ctx.fillStyle='#ff536e';ctx.fillRect(e.x-19,e.y-27,38*Math.max(0,e.hp/e.maxhp),5)}fighter(b.player);ctx.restore()}
function fighter(f){ctx.save();ctx.translate(f.x,f.y);ctx.fillStyle='#06102588';ctx.beginPath();ctx.ellipse(2,11,18,8,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=f.color;ctx.beginPath();ctx.arc(0,0,f.r,0,Math.PI*2);ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='#fff';ctx.stroke();ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='22px Arial';ctx.fillText(f.emoji,0,1);ctx.restore()}
function finish(win){if(!battle)return;let n=battle.elims;battle=null;cancelAnimationFrame(raf);if(n>saveData.miraBest){saveData.miraBest=n;save();}if(win){saveData.wins++;saveData.coins+=35;saveData.trophies+=5;save()}openModal(`<div class="bigemoji">win?'🏆':'💫'</div><h2>{win?'VITÓRIA!':'FIM DE JOGO'}</h2><p>win?'Vocêvenceuaarena!':'Tentenovamenteemelhoresuaestratégia.'</p><p>Eliminações:<b>{n}</b></p><p>${win?'Recompensa: +35 moedas e +5 troféus':'Moedas por eliminações foram mantidas.'}</p><button class="gold" onclick="closeModal();startBattle()">JOGAR DE NOVO</button> <button class="dark" onclick="closeModal();home()">INÍCIO</button>`)}
window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();keys[e.key]=true;if(e.key===' ')attack()});window.addEventListener('keyup',e=>keys[e.key]=false);document.getElementById('attack').addEventListener('pointerdown',e=>{e.preventDefault();attack()});canvas.addEventListener('pointerdown',e=>{if(!battle)return;touch={x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!touch||!battle)return;let dx=e.clientX-touch.x,dy=e.clientY-touch.y;keys.d=dx>12;keys.a=dx< -12;keys.s=dy>12;keys.w=dy< -12});canvas.addEventListener('pointerup',()=>{touch=null;keys.w=keys.a=keys.s=keys.d=false});window.addEventListener('resize',()=>{if(battle)resize()});
wallet();home();
</script></body></html>
